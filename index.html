<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📐 Olimpiadas Matemáticas - Entrenador</title>
    
    <!-- 🔐 VERIFICACIÓN INMEDIATA - Redirige al login si no hay usuario -->
    <script>
        (function() {
            // Redirigir al login si no hay usuario guardado
            if (!localStorage.getItem('username')) {
                window.location.href = '/home/';
                return;
            }
        })();
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
            flex-wrap: wrap;
            gap: 10px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .logout-btn {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .logout-btn:hover { background: #c53030; transform: scale(1.05); }
        h1 { font-size: 1.8rem; color: #2d3748; }
        .stats {
            display: flex;
            gap: 20px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .stats span {
            background: #f7fafc;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
        }
        .stats .correct { color: #48bb78; }
        .stats .wrong { color: #f56565; }
        .question-text {
            font-size: 1.5rem;
            margin: 20px 0;
            padding: 25px;
            background: #f7fafc;
            border-radius: 15px;
            min-height: 80px;
            display: flex;
            align-items: center;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }
        .option-btn {
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
            text-align: left;
        }
        .option-btn:hover:not(.disabled) {
            background: #ebf4ff;
            border-color: #667eea;
            transform: scale(1.02);
        }
        .option-btn.correct {
            background: #c6f6d5;
            border-color: #48bb78;
        }
        .option-btn.wrong {
            background: #fed7d7;
            border-color: #f56565;
        }
        .option-btn.disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .feedback {
            padding: 15px 20px;
            border-radius: 12px;
            margin: 15px 0;
            font-weight: 500;
        }
        .feedback.success { background: #c6f6d5; color: #22543d; }
        .feedback.error { background: #fed7d7; color: #742a2a; }
        .feedback.info { background: #ebf4ff; color: #2b4b8f; }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover { background: #5a67d8; transform: scale(1.05); }
        .btn-secondary {
            background: #e2e8f0;
            color: #2d3748;
        }
        .btn-secondary:hover { background: #cbd5e0; }
        .action-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        .ranking-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #e2e8f0;
        }
        .ranking-section h3 {
            margin-bottom: 15px;
            color: #2d3748;
        }
        .ranking-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            background: #f7fafc;
            border-radius: 10px;
            margin-bottom: 5px;
        }
        .ranking-item.current-user {
            background: #ebf4ff;
            border: 2px solid #667eea;
        }
        .ranking-item .rank { font-weight: 700; color: #667eea; }
        .ranking-item .name { flex: 1; margin-left: 10px; }
        .ranking-item .score { font-weight: 600; color: #2d3748; }
        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
            .container { padding: 20px; }
            h1 { font-size: 1.4rem; }
            .question-text { font-size: 1.2rem; padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 Olimpiadas Matemáticas</h1>
            <div class="user-info">
                <span id="userName">👤 Usuario</span>
                <span id="userGrade" style="background:#667eea;color:white;padding:3px 12px;border-radius:15px;font-size:0.9rem;">Grado 7</span>
                <button class="logout-btn" onclick="logout()">🚪 Salir</button>
            </div>
        </div>

        <div class="stats">
            <span>✅ <span class="correct" id="correctCount">0</span></span>
            <span>❌ <span class="wrong" id="wrongCount">0</span></span>
        </div>

        <div class="question-text" id="questionText">Haz clic en "Generar" para empezar</div>

        <div class="options-grid" id="optionsContainer">
            <button class="option-btn" onclick="selectOption(0)">A) ---</button>
            <button class="option-btn" onclick="selectOption(1)">B) ---</button>
            <button class="option-btn" onclick="selectOption(2)">C) ---</button>
            <button class="option-btn" onclick="selectOption(3)">D) ---</button>
        </div>

        <div class="feedback info" id="feedback">💡 Elige una opción para comprobar</div>

        <div class="action-row">
            <button class="btn btn-primary" onclick="generateQuestion()">🔄 Generar pregunta</button>
            <button class="btn btn-secondary" onclick="resetStats()">⟲ Reiniciar puntuación</button>
        </div>

        <div class="ranking-section">
            <h3>🏆 Tabla de clasificación</h3>
            <div id="rankingList">Cargando ranking...</div>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURACIÓN DE FIREBASE (Reemplaza con tus datos)
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyB7nXyQzJkNvP5nqVzSgRwTqLm9Xp2Y3fA",
            authDomain: "olimpiadas-mate.firebaseapp.com",
            databaseURL: "https://olimpiadas-mate-default-rtdb.firebaseio.com",
            projectId: "olimpiadas-mate",
            storageBucket: "olimpiadas-mate.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef123456"
        };

        // Cargar Firebase
        let firebaseReady = false;

        function initFirebase() {
            if (typeof firebase !== 'undefined' && !firebase.apps.length) {
                try {
                    firebase.initializeApp(firebaseConfig);
                    firebaseReady = true;
                    console.log('✅ Firebase inicializado');
                    loadUser();
                    loadRanking();
                } catch(e) {
                    console.error('Error inicializando Firebase:', e);
                }
            }
        }

        // Cargar Firebase desde CDN
        const fbScript = document.createElement('script');
        fbScript.src = "https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js";
        fbScript.onload = function() {
            const dbScript = document.createElement('script');
            dbScript.src = "https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js";
            dbScript.onload = function() {
                initFirebase();
            };
            document.head.appendChild(dbScript);
        };
        document.head.appendChild(fbScript);

        // Fallback: intentar cada segundo
        let fbAttempts = 0;
        const fbCheck = setInterval(() => {
            fbAttempts++;
            if (firebaseReady) {
                clearInterval(fbCheck);
                return;
            }
            if (typeof firebase !== 'undefined' && !firebase.apps.length) {
                initFirebase();
            }
            if (fbAttempts > 15) {
                clearInterval(fbCheck);
                console.warn('⚠️ Firebase no cargó, modo local');
                loadUser();
            }
        }, 1000);

        // ============================================================
        // VARIABLES GLOBALES
        // ============================================================
        let currentUser = null;
        let currentGrade = 7;
        let correctCount = 0;
        let wrongCount = 0;
        let currentQuestion = null;
        let answered = false;

        // ============================================================
        // USUARIO
        // ============================================================
        function loadUser() {
            const username = localStorage.getItem('username');
            const grade = localStorage.getItem('grade');
            if (username) {
                currentUser = username;
                document.getElementById('userName').textContent = '👤 ' + username;
                if (grade) {
                    currentGrade = parseInt(grade);
                    document.getElementById('userGrade').textContent = 'Grado ' + grade;
                }
                generateQuestion();
            } else {
                window.location.href = '/home/';
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/home/';
        }

        // ============================================================
        // GENERADOR DE PREGUNTAS
        // ============================================================
        function generateQuestion() {
            const grade = currentGrade;
            let q = generateMathQuestion(grade);
            currentQuestion = q;
            answered = false;

            document.getElementById('questionText').textContent = q.text;
            const letters = ['A', 'B', 'C', 'D'];
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach((btn, i) => {
                btn.textContent = letters[i] + ') ' + q.options[i];
                btn.className = 'option-btn';
                btn.disabled = false;
            });
            const fb = document.getElementById('feedback');
            fb.textContent = '💡 Elige una opción para comprobar';
            fb.className = 'feedback info';
        }

        function generateMathQuestion(grade) {
            const types = ['arithmetic', 'algebra'];
            const type = types[Math.floor(Math.random() * types.length)];

            if (type === 'arithmetic') {
                let maxNum = 10 + grade * 3;
                let a = Math.floor(Math.random() * maxNum) + 1;
                let b = Math.floor(Math.random() * maxNum) + 1;
                let op = Math.random() > 0.5 ? '+' : '-';
                let result = op === '+' ? a + b : a - b;
                if (result < 0) { [a, b] = [b, a]; result = a - b; }
                let text = `${a} ${op} ${b} = ?`;
                let correct = result;
                let options = generateOptions(correct, grade);
                return { text, options, correctIndex: options.indexOf(correct) };
            } else {
                let x = Math.floor(Math.random() * 10) + 1;
                let a = Math.floor(Math.random() * 5) + 1;
                let b = Math.floor(Math.random() * 10) + 1;
                let c = a * x + b;
                let text = `${a}x + ${b} = ${c}`;
                let correct = x;
                let options = generateOptions(correct, grade);
                return { text, options, correctIndex: options.indexOf(correct) };
            }
        }

        function generateOptions(correct, grade) {
            let opts = new Set([correct]);
            while (opts.size < 4) {
                let offset = Math.floor(Math.random() * 6) + 1;
                let candidate = correct + (Math.random() > 0.5 ? offset : -offset);
                if (candidate !== correct && candidate > 0) opts.add(candidate);
            }
            return Array.from(opts).sort(() => Math.random() - 0.5);
        }

        // ============================================================
        // SELECCIONAR OPCIÓN
        // ============================================================
        function selectOption(index) {
            if (answered || !currentQuestion) return;
            answered = true;

            const btns = document.querySelectorAll('.option-btn');
            const isCorrect = index === currentQuestion.correctIndex;

            btns.forEach((btn, i) => {
                btn.disabled = true;
                btn.className = 'option-btn disabled';
                if (i === currentQuestion.correctIndex) {
                    btn.classList.add('correct');
                }
                if (i === index && !isCorrect) {
                    btn.classList.add('wrong');
                }
            });

            const feedback = document.getElementById('feedback');
            if (isCorrect) {
                feedback.textContent = '✅ ¡Correcto!';
                feedback.className = 'feedback success';
                correctCount++;
                saveScore(true);
            } else {
                feedback.textContent = '❌ Incorrecto. La respuesta era: ' + currentQuestion.options[currentQuestion.correctIndex];
                feedback.className = 'feedback error';
                wrongCount++;
                saveScore(false);
            }

            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;
            loadRanking();
        }

        // ============================================================
        // REINICIAR ESTADÍSTICAS
        // ============================================================
        function resetStats() {
            correctCount = 0;
            wrongCount = 0;
            document.getElementById('correctCount').textContent = '0';
            document.getElementById('wrongCount').textContent = '0';
            const fb = document.getElementById('feedback');
            fb.textContent = '📊 Puntuación reiniciada';
            fb.className = 'feedback info';
        }

        // ============================================================
        // FIREBASE - GUARDAR PUNTUACIÓN
        // ============================================================
        async function saveScore(isCorrect) {
            if (!firebaseReady || !currentUser) return;
            try {
                const db = firebase.database();
                const ref = db.ref('usuarios/' + currentUser);
                const snap = await ref.once('value');
                if (snap.exists()) {
                    const data = snap.val();
                    const newScore = (data.score || 0) + (isCorrect ? 10 : -5);
                    await ref.update({
                        score: Math.max(0, newScore),
                        gamesPlayed: (data.gamesPlayed || 0) + 1,
                        lastPlayed: Date.now()
                    });
                }
            } catch (e) { console.error('Error guardando:', e); }
        }

        // ============================================================
        // FIREBASE - RANKING
        // ============================================================
        async function loadRanking() {
            if (!firebaseReady) return;
            try {
                const db = firebase.database();
                const snap = await db.ref('usuarios').once('value');
                if (!snap.exists()) {
                    document.getElementById('rankingList').innerHTML = 'Sin participantes';
                    return;
                }
                const users = snap.val();
                const ranking = Object.values(users)
                    .filter(u => u.username && u.username !== 'Sadmin')
                    .sort((a, b) => (b.score || 0) - (a.score || 0))
                    .slice(0, 10);

                document.getElementById('rankingList').innerHTML = ranking.map((u, i) =>
                    `<div class="ranking-item ${u.username === currentUser ? 'current-user' : ''}">
                        <span class="rank">#${i+1}</span>
                        <span class="name">${u.username}</span>
                        <span class="score">${u.score || 0} pts</span>
                    </div>`
                ).join('');
            } catch (e) { console.error('Error ranking:', e); }
        }
    </script>
</body>
</html>
